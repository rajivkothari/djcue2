name: Bhangra
description: Punjabi dance music — heavy dhol, call-and-response vocals

cues:
  1:
    detect: mix_in
    label: "Intro"
    color: yellow
  2:
    detect: first_vocal
    label: "Verse"
    color: orange
  3:
    detect: first_chorus
    label: "Hook 1"
    color: purple
  4:
    detect: second_chorus
    label: "Hook 2"
    color: red
  5:
    detect: third_chorus
    label: "Hook 3"
    color: green
    optional: true
  6:
    detect: outro_start
    label: "Outro"
    color: teal

analysis:
  intro_energy_percentile: 20
  drop_energy_ratio: 1.2
  min_section_seconds: 3.0
