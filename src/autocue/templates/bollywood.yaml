name: Bollywood
description: Hindi film songs — verse-chorus with instrumental interludes

cues:
  1:
    detect: mix_in
    label: "Intro"
    color: yellow
  2:
    detect: bar_9
    label: "Verse"
    color: orange
  3:
    detect: bar_17
    label: "Chorus 1"
    color: purple
  4:
    detect: second_chorus
    label: "Chorus 2"
    color: red
  5:
    detect: third_chorus
    label: "Chorus 3"
    color: green
    optional: true
  6:
    detect: outro_start
    label: "Outro"
    color: teal

analysis:
  intro_energy_percentile: 20
  drop_energy_ratio: 1.3
  min_section_seconds: 4.0
