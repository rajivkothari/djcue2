name: EDM
description: Western electronic dance music (house, techno, trance)

cues:
  1:
    detect: mix_in
    label: "Intro"
    color: yellow
  2:
    detect: first_vocal
    label: "Vocal"
    color: orange
    optional: true
  3:
    detect: first_chorus
    label: "Drop 1"
    color: purple
  4:
    detect: second_chorus
    label: "Drop 2"
    color: red
  5:
    detect: third_chorus
    label: "Drop 3"
    color: green
    optional: true
  6:
    detect: outro_start
    label: "Outro"
    color: teal

analysis:
  intro_energy_percentile: 25
  drop_energy_ratio: 1.5
  min_section_seconds: 4.0
