<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engine DJ Auto-Cue</title>
<script src="https://unpkg.com/wavesurfer.js@7"></script>
<style>
  :root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --bg3: #0f3460;
    --fg: #e0e0e0;
    --fg2: #a0a0a0;
    --accent: #e94560;
    --success: #4ecca3;
    --warning: #f5a623;
    --border: #2a2a4a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--bg2);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; font-weight: 600; white-space: nowrap; }
  .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .header-controls select, .header-controls button {
    background: var(--bg3);
    color: var(--fg);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    min-width: 100px;
  }
  .header-controls select#source-name { min-width: 220px; }
  .header-controls select#template-select { min-width: 120px; }
  .header-controls button:hover { background: var(--accent); }
  .header-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  #schema-badge {
    font-size: 11px;
    background: var(--bg3);
    padding: 3px 8px;
    border-radius: 10px;
    color: var(--fg2);
    margin-left: auto;
  }

  .main { display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 300px;
    min-width: 250px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 10px 14px;
    font-size: 13px;
    color: var(--fg2);
    border-bottom: 1px solid var(--border);
  }
  .track-list {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .track-item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .track-item:hover { background: rgba(255,255,255,0.05); }
  .track-item.active { background: var(--bg3); border-left: 3px solid var(--accent); }
  .track-item.done { opacity: 0.5; }
  .track-item .title { font-size: 13px; font-weight: 500; }
  .track-item .artist { font-size: 11px; color: var(--fg2); }
  .track-item .badge {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 8px;
  }
  .badge-cues { background: var(--bg3); color: var(--fg2); }
  .badge-done { background: var(--success); color: #000; }

  .content { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }

  .track-info {
    display: flex;
    gap: 20px;
    align-items: baseline;
    margin-bottom: 16px;
  }
  .track-info h2 { font-size: 20px; }
  .track-info .meta { color: var(--fg2); font-size: 14px; }

  #waveform-container {
    position: relative;
    background: var(--bg2);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
    min-height: 150px;
  }
  #waveform { width: 100%; }
  .cue-marker {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    z-index: 10;
    cursor: pointer;
    pointer-events: auto;
  }
  .cue-marker:hover { width: 4px; }
  .cue-marker .cue-flag {
    position: absolute;
    top: 2px;
    pointer-events: auto;
    left: 2px;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 2px;
    white-space: nowrap;
    font-weight: 600;
    color: #000;
  }

  .status-bar {
    background: var(--bg2);
    padding: 8px 16px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 36px;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cue-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  .cue-table th {
    text-align: left;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--fg2);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .cue-table td {
    padding: 8px 12px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .cue-table tr:hover { background: rgba(255,255,255,0.03); }
  .color-dot {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    vertical-align: middle;
    margin-right: 6px;
  }
  .conf-low { color: var(--warning); }
  .conf-ok { color: var(--success); }

  .actions { display: flex; gap: 10px; margin-top: 8px; }
  .btn {
    padding: 10px 24px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #d63851; }
  .btn-success { background: var(--success); color: #000; }
  .btn-success:hover:not(:disabled) { background: #3db88e; }
  .btn-outline {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
  }
  .btn-outline:hover:not(:disabled) { background: rgba(255,255,255,0.1); }

  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg2);
    font-size: 15px;
    text-align: center;
    line-height: 1.8;
  }

  .overwrite-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg2); }
  .overwrite-toggle input { accent-color: var(--accent); }

  .btn-play {
    background: none;
    border: 1px solid var(--border);
    color: var(--accent);
    cursor: pointer;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background 0.15s;
  }
  .btn-play:hover { background: var(--bg3); }
  .btn-stop {
    background: none;
    border: 1px solid var(--border);
    color: var(--warning);
    cursor: pointer;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 13px;
  }
  .btn-stop:hover { background: var(--bg3); }
</style>
</head>
<body>

<header>
  <h1>Auto-Cue</h1>
  <div class="header-controls">
    <select id="source-type">
      <option value="playlist">Playlist</option>
      <option value="crate">Crate</option>
    </select>
    <select id="source-name"><option value="">-- select --</option></select>
    <select id="template-select"></select>
    <button id="load-btn" onclick="loadTracks()">Load</button>
  </div>
  <span id="schema-badge"></span>
</header>

<div class="main">
  <div class="sidebar" id="sidebar" style="display:none;">
    <div class="sidebar-header" id="sidebar-header">Tracks</div>
    <div class="track-list" id="track-list"></div>
  </div>

  <div class="content" id="content">
    <div class="empty-state" id="empty-state">
      Select a playlist or crate and click <strong>Load</strong> to begin.
    </div>

    <div id="review-panel" style="display:none;">
      <div class="track-info">
        <h2 id="track-title"></h2>
        <span class="meta" id="track-meta"></span>
      </div>

      <div id="waveform-container">
        <div id="waveform"></div>
        <div id="cue-markers"></div>
      </div>

      <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
        <div class="status-bar" id="status-bar" style="flex:1; margin:0;">Ready</div>
        <button class="btn-stop" onclick="stopPreview()">&#9632; Stop</button>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
        <label class="overwrite-toggle">
          <input type="checkbox" id="overwrite-check"> Overwrite existing cues
        </label>
      </div>

      <table class="cue-table" id="cue-table">
        <thead>
          <tr><th></th><th>Slot</th><th>Label</th><th>Time</th><th>Color</th><th>Confidence</th><th>Status</th></tr>
        </thead>
        <tbody id="cue-tbody"></tbody>
      </table>

      <div class="actions">
        <button class="btn btn-primary" id="analyze-btn" onclick="analyzeTrack()">Analyze</button>
        <button class="btn btn-success" id="finalize-btn" onclick="finalizeTrack()" disabled>Finalize Cues</button>
        <button class="btn btn-outline" id="skip-btn" onclick="nextTrack()">Skip</button>
      </div>
    </div>
  </div>
</div>

<script>
let tracks = [];
let currentIdx = -1;
let proposedCues = null;
let wavesurfer = null;
let doneSet = new Set();

async function init() {
  try {
    const schemaRes = await fetch('/api/schema');
    const schema = await schemaRes.json();
    document.getElementById('schema-badge').textContent = `Schema ${schema.version || schema.error}`;

    const playlistRes = await fetch('/api/playlists');
    const playlistText = await playlistRes.text();
    console.log('playlists:', playlistRes.status, playlistText);
    let playlists = [];
    try { playlists = JSON.parse(playlistText); } catch(e) { console.error('playlists parse error', e); }

    const crateRes = await fetch('/api/crates');
    const crateText = await crateRes.text();
    console.log('crates:', crateRes.status, crateText);
    let crates = [];
    try { crates = JSON.parse(crateText); } catch(e) { console.error('crates parse error', e); }

    const templateRes = await fetch('/api/templates');
    const templateText = await templateRes.text();
    console.log('templates:', templateRes.status, templateText);
    let templates = [];
    try { templates = JSON.parse(templateText); } catch(e) { console.error('templates parse error', e); }

    window._playlists = Array.isArray(playlists) ? playlists : [];
    window._crates = Array.isArray(crates) ? crates : [];

    if (window._playlists.length === 0 && window._crates.length === 0) {
      document.getElementById('empty-state').innerHTML =
        'No playlists or crates found.<br>Make sure Engine DJ is <b>closed</b>, then restart the server.';
    }

    populateSourceNames();
    document.getElementById('source-type').addEventListener('change', populateSourceNames);

    const tSel = document.getElementById('template-select');
    (Array.isArray(templates) ? templates : []).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.name;
      tSel.appendChild(opt);
    });
  } catch (e) {
    console.error('init failed:', e);
    document.getElementById('schema-badge').textContent = 'Connection error';
    document.getElementById('empty-state').textContent = 'Failed to connect: ' + e.message;
  }
}

function populateSourceNames() {
  const type = document.getElementById('source-type').value;
  const sel = document.getElementById('source-name');
  sel.innerHTML = '<option value="">-- select --</option>';
  const items = type === 'playlist' ? window._playlists : window._crates;
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.title;
    opt.textContent = `${item.title} (${item.track_count})`;
    sel.appendChild(opt);
  });
}

async function loadTracks() {
  const type = document.getElementById('source-type').value;
  const name = document.getElementById('source-name').value;
  if (!name) return;

  document.getElementById('load-btn').disabled = true;
  const res = await fetch(`/api/tracks?type=${encodeURIComponent(type)}&name=${encodeURIComponent(name)}`);
  tracks = await res.json();
  document.getElementById('load-btn').disabled = false;

  doneSet.clear();
  currentIdx = -1;
  proposedCues = null;

  document.getElementById('sidebar').style.display = 'flex';
  document.getElementById('sidebar-header').textContent = `${name} (${tracks.length} tracks)`;

  renderTrackList();

  if (tracks.length > 0) {
    selectTrack(0);
  } else {
    document.getElementById('empty-state').style.display = 'flex';
    document.getElementById('review-panel').style.display = 'none';
  }
}

function renderTrackList() {
  const list = document.getElementById('track-list');
  list.innerHTML = '';
  tracks.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'track-item' + (i === currentIdx ? ' active' : '') + (doneSet.has(t.id) ? ' done' : '');
    div.innerHTML = `
      <div class="title">${esc(t.title)}</div>
      <div class="artist">${esc(t.artist)}</div>
      ${doneSet.has(t.id) ? '<span class="badge badge-done">Done</span>' :
        t.has_cues ? '<span class="badge badge-cues">Has cues</span>' : ''}
    `;
    div.onclick = () => selectTrack(i);
    list.appendChild(div);
  });
}

function selectTrack(idx) {
  currentIdx = idx;
  proposedCues = null;
  const track = tracks[idx];

  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('review-panel').style.display = 'block';

  document.getElementById('track-title').textContent = track.title;
  document.getElementById('track-meta').textContent =
    `${track.artist} | ${track.bpm ? track.bpm.toFixed(1) + ' BPM' : 'BPM unknown'} | ID ${track.id}`;

  document.getElementById('status-bar').innerHTML = 'Click <strong>Analyze</strong> to detect cue points';
  document.getElementById('finalize-btn').disabled = true;
  document.getElementById('analyze-btn').disabled = false;

  document.getElementById('cue-tbody').innerHTML = '';
  document.getElementById('cue-markers').innerHTML = '';

  renderTrackList();
  loadWaveform(track.id);
}

function loadWaveform(trackId) {
  if (wavesurfer) {
    wavesurfer.destroy();
    wavesurfer = null;
  }
  wavesurfer = WaveSurfer.create({
    container: '#waveform',
    waveColor: '#4a4a6a',
    progressColor: '#e94560',
    cursorColor: '#ffffff44',
    height: 100,
    barWidth: 2,
    barGap: 1,
    barRadius: 2,
    normalize: true,
    url: `/api/audio/${trackId}`,
  });
  wavesurfer.on('error', (err) => {
    document.getElementById('status-bar').innerHTML = `<span style="color:var(--warning)">Audio load error: ${esc(String(err))}</span>`;
  });
}

async function analyzeTrack() {
  const track = tracks[currentIdx];
  const template = document.getElementById('template-select').value;
  const overwrite = document.getElementById('overwrite-check').checked;

  document.getElementById('analyze-btn').disabled = true;
  document.getElementById('status-bar').innerHTML = '<div class="spinner"></div> Analyzing...';

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ track_id: track.id, template, overwrite }),
    });
    const data = await res.json();
    if (data.error) {
      document.getElementById('status-bar').innerHTML = `<span style="color:var(--warning)">${esc(data.error)}</span>`;
      document.getElementById('analyze-btn').disabled = false;
      return;
    }

    proposedCues = data;
    renderProposedCues(data);
    renderCueMarkers(data);
    document.getElementById('status-bar').innerHTML = `Analysis complete. Review cues below, then <strong>Finalize</strong> or <strong>Skip</strong>.`;
    document.getElementById('finalize-btn').disabled = false;
  } catch (e) {
    document.getElementById('status-bar').innerHTML = `<span style="color:var(--warning)">Error: ${esc(String(e))}</span>`;
  }
  document.getElementById('analyze-btn').disabled = false;
}

function renderProposedCues(data) {
  const tbody = document.getElementById('cue-tbody');
  tbody.innerHTML = '';
  data.proposed.forEach(cue => {
    const tr = document.createElement('tr');
    let status = '';
    if (!cue.detected) {
      status = cue.optional ? 'Optional — skipped' : 'Not detected';
    } else if (cue.has_existing) {
      status = 'Exists (skip)';
    } else {
      status = 'Will write';
    }
    const confClass = cue.confidence >= 0.4 ? 'conf-ok' : 'conf-low';
    const playBtn = cue.detected && cue.time_seconds != null
      ? `<button class="btn-play" onclick="previewCue(${cue.time_seconds})">&#9654;</button>`
      : '';
    tr.innerHTML = `
      <td>${playBtn}</td>
      <td>${cue.slot}</td>
      <td>${esc(cue.label)}</td>
      <td>${cue.detected ? cue.time_display : '—'}</td>
      <td><span class="color-dot" style="background:${cue.color_hex}"></span>${cue.color_name}</td>
      <td class="${confClass}">${cue.detected ? (cue.confidence * 100).toFixed(0) + '%' : '—'}</td>
      <td>${status}</td>
    `;
    tbody.appendChild(tr);
  });
}

function renderCueMarkers(data) {
  const container = document.getElementById('cue-markers');
  container.innerHTML = '';
  if (!wavesurfer) return;

  const duration = wavesurfer.getDuration();
  if (!duration || duration <= 0) {
    wavesurfer.on('ready', () => renderCueMarkers(data));
    return;
  }

  data.proposed.forEach(cue => {
    if (!cue.detected || !cue.time_seconds) return;
    const pct = (cue.time_seconds / duration) * 100;
    if (pct < 0 || pct > 100) return;

    const marker = document.createElement('div');
    marker.className = 'cue-marker';
    marker.style.left = pct + '%';
    marker.style.backgroundColor = cue.color_hex;
    marker.innerHTML = `<span class="cue-flag" style="background:${cue.color_hex}">${cue.slot} ${esc(cue.label)}</span>`;
    marker.onclick = () => previewCue(cue.time_seconds);
    container.appendChild(marker);
  });
}

async function finalizeTrack() {
  if (!proposedCues) return;
  const overwrite = document.getElementById('overwrite-check').checked;

  const cuesToWrite = proposedCues.proposed.filter(c => c.detected && !c.has_existing);
  if (overwrite) {
    cuesToWrite.push(...proposedCues.proposed.filter(c => c.detected && c.has_existing));
  }

  if (cuesToWrite.length === 0) {
    document.getElementById('status-bar').innerHTML = 'No cues to write.';
    return;
  }

  document.getElementById('finalize-btn').disabled = true;
  document.getElementById('status-bar').innerHTML = '<div class="spinner"></div> Writing cues...';

  try {
    const res = await fetch('/api/finalize', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        track_id: proposedCues.track_id,
        cues: cuesToWrite,
        overwrite,
      }),
    });
    const data = await res.json();
    if (data.error) {
      document.getElementById('status-bar').innerHTML = `<span style="color:var(--warning)">${esc(data.error)}</span>`;
      document.getElementById('finalize-btn').disabled = false;
      return;
    }

    document.getElementById('status-bar').innerHTML =
      `<span style="color:var(--success)">${esc(data.message)}. Backup: ${esc(data.backup)}</span>`;
    doneSet.add(proposedCues.track_id);
    renderTrackList();

    setTimeout(() => nextTrack(), 1500);
  } catch (e) {
    document.getElementById('status-bar').innerHTML = `<span style="color:var(--warning)">Error: ${esc(String(e))}</span>`;
    document.getElementById('finalize-btn').disabled = false;
  }
}

function nextTrack() {
  if (currentIdx < tracks.length - 1) {
    selectTrack(currentIdx + 1);
  } else {
    document.getElementById('status-bar').innerHTML =
      '<span style="color:var(--success)">All tracks reviewed!</span>';
  }
}

let previewTimeout = null;

function previewCue(timeSeconds) {
  if (!wavesurfer) return;
  const duration = wavesurfer.getDuration();
  if (!duration || duration <= 0) return;

  if (previewTimeout) {
    clearTimeout(previewTimeout);
    previewTimeout = null;
  }

  wavesurfer.seekTo(timeSeconds / duration);
  wavesurfer.play();

  previewTimeout = setTimeout(() => {
    wavesurfer.pause();
    previewTimeout = null;
  }, 8000);
}

function stopPreview() {
  if (wavesurfer) wavesurfer.pause();
  if (previewTimeout) {
    clearTimeout(previewTimeout);
    previewTimeout = null;
  }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
</body>
</html>
